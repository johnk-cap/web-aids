<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Prevents browser caching of this redirect HTML page -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Redirecting...</title>
  <script>
    function redirectByMondayAndMonth() {
      const destinations = {
        'blue-1': 'blue1.jpg',
        'blue-2': 'blue2.jpg',
        'blue-3': 'blue3.jpg',
        'blue-4': 'blue4.jpg',
        'blue-5': 'blue5.jpg',
        'red-1':  'red1.jpg',
        'red-2':  'red2.jpg',
        'red-3':  'red3.jpg',
        'red-4':  'red4.jpg',
        'red-5':  'red5.jpg'
      };

      // Check URL parameters for ?target=next
      const urlParams = new URLSearchParams(window.location.search);
      const isNextMonday = urlParams.get('target') === 'next';

      const today = new Date();
      const dayOfWeek = today.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday

      // Base days until target Monday (0 if today is Monday)
      let daysUntilMonday = (1 + 7 - dayOfWeek) % 7;

      // Add 7 additional days if "next" week is requested via query string
      if (isNextMonday) {
        daysUntilMonday += 7;
      }

      // Advance date to target Monday
      const targetMonday = new Date(today);
      targetMonday.setDate(today.getDate() + daysUntilMonday);

      // Determine month parity of target Monday (1-indexed: 1 = Jan, 2 = Feb, etc.)
      const monthNumber = targetMonday.getMonth() + 1;
      const colorPrefix = (monthNumber % 2 !== 0) ? 'blue' : 'red';

      // Determine target Monday's ordinal position (1st through 5th)
      const mondayOrdinal = Math.ceil(targetMonday.getDate() / 7);

      // Construct look-up key (e.g., "blue-1", "red-4")
      const destinationKey = `${colorPrefix}-${mondayOrdinal}`;

      if (destinations[destinationKey]) {
        // Append unique timestamp parameter to bypass cache on target URL
        const cacheBustingUrl = destinations[destinationKey] + '?nocache=' + Date.now();

        // Redirect directly without saving redirect page into session history
        window.location.replace(cacheBustingUrl);
      }
    }

    // Run redirection logic immediately
    redirectByMondayAndMonth();
  </script>
</head>
<body>
  <p>Redirecting to your destination, please wait...</p>

  <noscript>
    <p>JavaScript is disabled in your browser. Please enable JavaScript to be automatically redirected.</p>
  </noscript>
</body>
</html>
