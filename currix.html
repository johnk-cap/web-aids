<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- No-cache Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Auto-Reload every 120 seconds (2 minutes) with redirect to entry point -->
    <meta http-equiv="refresh" content="120; url=scheddis.html">

    <title>Track Schedule Display</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* Root viewport container for mobile rotation and fade-in initialization */
        #viewport-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            
            /* Initial state for smooth 1.5s fade-in */
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        /* Applied once layout and background image load */
        #viewport-wrapper.loaded {
            opacity: 1;
        }

        /* 90-degree clockwise rotation styling for mobile devices */
        .is-mobile-rotated {
            width: 100vh !important;
            height: 100vw !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
        }

        /* Aspect-ratio constrained image container */
        #image-container {
            position: relative;
            overflow: hidden;
            background-color: transparent;
        }

        /* 
            Positioned in the Top-Left Quadrant of the Top-Right Quadrant
            (top: 0%, left: 50%, width: 25%, height: 25%)
        */
        .date-display-wrapper {
            position: absolute;
            top: 0;
            left: 50%;
            width: 25%;
            height: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
            container-type: size;
            z-index: 10;
        }

        .day-text {
            color: #000000;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 800;
            font-size: 14cqw;
            line-height: 1.15;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
            letter-spacing: 0.02em;
        }

        .date-text {
            color: #000000;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 700;
            font-size: 11cqw;
            line-height: 1.15;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
            letter-spacing: 0.05em;
        }

        /* 
            Left Half Document Frame Wrapper (4-Mondays Track Document)
            Positioned at top: 7.5%, left: 5.0%, width: 42.5%, height: 85.0%
        */
        .left-half-doc-wrapper {
            position: absolute;
            top: 7.5%;
            left: 3.0%;
            width: 45.5%;
            height: 85.0%;
            overflow: hidden;
            pointer-events: none; /* Blocks user scrolling & touch events */
        }

        .left-half-container {
            width: 100%;
            height: 100%;
            position: relative;
            container-type: size;
            overflow: hidden;
        }

        .left-half-container iframe {
            width: 800px;
            height: 1800px;
            border: 0;
            background-color: transparent;
            overflow: hidden;
            pointer-events: none;
            -ms-overflow-style: none;  /* IE & Edge */
            scrollbar-width: none;  /* Firefox */
            transform-origin: top left;
            transform: scale(calc(100cqw / 800));
        }

        .left-half-container iframe::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* 
            Right Half Frame Wrapper (Dual Side-by-Side Google Docs)
            Sized at 42.5% x 45.5%, positioned at bottom: 7.5%, right: 5.0%
        */
        .doc-frame-wrapper {
            position: absolute;
            bottom: 7.5%;
            right: 5.0%;
            width: 42.5%;
            height: 45.5%;
            overflow: hidden;
            pointer-events: none;
            display: flex;
            flex-direction: row;
            gap: 2%;
        }

        .sub-frame-container {
            width: 49%;
            height: 100%;
            position: relative;
            container-type: size;
            overflow: hidden;
        }

        .sub-frame-container iframe {
            width: 800px;
            height: 1800px;
            border: 0;
            background-color: transparent;
            overflow: hidden;
            pointer-events: none;
            -ms-overflow-style: none;
            scrollbar-width: none;
            transform-origin: top left;
            transform: scale(calc(100cqw / 800));
        }

        .sub-frame-container iframe::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center overflow-hidden bg-black select-none">

    <!-- Root Viewport Wrapper -->
    <div id="viewport-wrapper">
        <!-- Aspect-Ratio Container -->
        <div id="image-container" class="relative">
            <!-- Background Image -->
            <img 
                id="bg-image" 
                alt="Background" 
                class="w-full h-full block object-fill pointer-events-none"
            />

            <!-- Left Half: 4-Mondays Track Document Display -->
            <div class="left-half-doc-wrapper bg-transparent overflow-hidden pointer-events-none">
                <div class="left-half-container">
                    <iframe 
                        id="track-frame"
                        scrolling="no"
                        title="Embedded 4-Mondays Track Document">
                    </iframe>
                </div>
            </div>

            <!-- Top-Right Quadrant: Dynamic US Military Date Display -->
            <div id="date-container" class="date-display-wrapper">
                <div id="day-of-week" class="day-text"></div>
                <div id="formatted-date" class="date-text"></div>
            </div>

            <!-- Bottom-Right Quadrant: Dual Side-by-Side Google Document Iframes -->
            <div class="doc-frame-wrapper bg-transparent overflow-hidden pointer-events-none">
                <div class="sub-frame-container">
                    <iframe 
                        id="left-frame"
                        scrolling="no"
                        title="Embedded Google Document 1">
                    </iframe>
                </div>
                <div class="sub-frame-container">
                    <iframe 
                        id="right-frame"
                        scrolling="no"
                        title="Embedded Google Document 2">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const bgImg = document.getElementById('bg-image');
            const imgContainer = document.getElementById('image-container');
            const viewportWrapper = document.getElementById('viewport-wrapper');
            const trackFrame = document.getElementById('track-frame');
            const leftFrame = document.getElementById('left-frame');
            const rightFrame = document.getElementById('right-frame');
            const dayOfWeekEl = document.getElementById('day-of-week');
            const formattedDateEl = document.getElementById('formatted-date');
            
            // 1. Right-side dual iframe configuration dictionary (red1-red5, blue1-blue5)
            const docConfig = {
                "red1": { left: "https://docs.google.com/document/d/e/2PACX-1vQPgfp_QHRXqqKf3OeJtzqfTi2p7IqhhaOkZL1mzCybjlHbLimE0FfQpw0OhQAVUzEdcBF5yyAY8QGp/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vRyjOKWi47QF_RW5hV5GbYKMR5jR5FiRZblpKYg0EeaK8PTclvJmttGYj9AynIp2OZQV4yZZ1Ob6hNB/pub?embedded=true" },
                "red2": { left: "https://docs.google.com/document/d/e/2PACX-1vS8Vhyfm1nG3NYtsJ-cN2fvy4oLzH73A_B8IiZUtR37sb5lo1MNz5aGd6-1-JNucIZ5hq4WFtU7rTrQ/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vQ8ZhCN6Wf6yO5-uEHtVpVWTPMg0kCDEs6c7QiCzWHtK0YWxnhP50zq_Rt9jDzD7y6Re_evsRHcuNm4/pub?embedded=true" },
                "red3": { left: "https://docs.google.com/document/d/e/2PACX-1vSImNvWFPls4C61UdOoxkjE860RgTPxq4EfvBhcDRmorwM8ZjTWNwewwk-1Se9gmmJGDpXZ5t-pbuJq/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vTt88ssmt65Bgoa3HxTntMBB58nQ8G9Mm2FFXz153lwtRwLp0pTNWlgfVr8Z8WhJ0QIngbHraH9Cgaf/pub?embedded=true" },
                "red4": { left: "https://docs.google.com/document/d/e/2PACX-1vR9cnbP8kBMcyAvJuu1Immtb9i5vmWjNfkqu3OhikQQUMAaX5MFJuAL17E4AFNCT6wr1puQZw8d0nfd/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vRP8jTyKyNB88gyV5Cu4aDAmsQQ-2bFPqePHvCw0q2ErYPM73Zr9nG4XRHuebl1UTDY56-DN0EqQsEn/pub?embedded=true" },
                "red5": { left: "https://docs.google.com/document/d/e/2PACX-1vTj1RVsxOFcWHOcoZjbJ_yDsRdP9aL3lcjIIJmWNZW7YYQ2MPtV5xo77jh3PI1MZL_xvHpJqF_J1vfV/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vQe6rgAWVxq5KHniB5QQUIHCm6JnVMA2vbcVQLYMIOnKKZ5Sq96NxKLOq1US_oLrtU-Y97x8ZHaFgis/pub?embedded=true" },
                
                "blue1": { left: "https://docs.google.com/document/d/e/2PACX-1vQVd3NFOy8P_3N6qPRap5F9PwPJm_Ya1ZGl1yeGyVWZjBjau-sXnq2MsqRvBfb-FvgDQadeAyYkIHWv/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vQpnCYi8h2SxeSFuX3T_1VRPBtHXA1C3nQl5UVIGn-78-PEZB2YpwNE5Qe7Z8iEZt92jIdSw_FRklIs/pub?embedded=true" },
                "blue2": { left: "https://docs.google.com/document/d/e/2PACX-1vREYDM6YQ-A3nnKNyFQNT1tKBXy18Yxj1ohKOtOMVyCUOsKaMyHyP8WEifduSZaho9oWh8mADR-pQXP/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vT8t0Lb3HHOtkPUxwibkQ0f7rk5iotOJZhIAlhzUa8zpCPAzXP6iqC4AnDw8N3-UwdMqaRs4p3d6OU9/pub?embedded=true" },
                "blue3": { left: "https://docs.google.com/document/d/e/2PACX-1vR2LS3cqiqK0IH29nC2333HM0Uo6MMBS-X20f0dQx_yurkoVK16SdIi8ix0H-ME5g-uEk7PHpVPlqI-/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vR8Gln1y4p2ttmL0DZWeznDVIWBD_VEvgFVlSAD9boUNogpcgVaqmrKA2eTZbF60pOUM4trny8C28pf/pub?embedded=true" },
                "blue4": { left: "https://docs.google.com/document/d/e/2PACX-1vQLuD7ZRk2M-Ph90cDBcG76583do5Tt4FETjewYd29gGJcWmhKKkDODwrnDl7mP3azltmZ7nL2zcxkC/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vTv9YZJ-RshNGIWmX9n3M9yAgaNsr2ZIDLG5vhGqKtz4Cji24f_b0G1sFUDciLbJotDn2zGycS3jDqj/pub?embedded=true" },
                "blue5": { left: "https://docs.google.com/document/d/e/2PACX-1vTj1RVsxOFcWHOcoZjbJ_yDsRdP9aL3lcjIIJmWNZW7YYQ2MPtV5xo77jh3PI1MZL_xvHpJqF_J1vfV/pub?embedded=true", right: "https://docs.google.com/document/d/e/2PACX-1vQe6rgAWVxq5KHniB5QQUIHCm6JnVMA2vbcVQLYMIOnKKZ5Sq96NxKLOq1US_oLrtU-Y97x8ZHaFgis/pub?embedded=true" }
            };

            // 2. Left-side 4-Mondays Track Document Configuration Dictionary (3 tracks x 4 weeks = 12 document URLs)
            const trackDocConfig = {
                "orientation": {
                    1: "https://docs.google.com/document/d/e/2PACX-1vQPgfp_QHRXqqKf3OeJtzqfTi2p7IqhhaOkZL1mzCybjlHbLimE0FfQpw0OhQAVUzEdcBF5yyAY8QGp/pub?embedded=true",
                    2: "https://docs.google.com/document/d/e/2PACX-1vS8Vhyfm1nG3NYtsJ-cN2fvy4oLzH73A_B8IiZUtR37sb5lo1MNz5aGd6-1-JNucIZ5hq4WFtU7rTrQ/pub?embedded=true",
                    3: "https://docs.google.com/document/d/e/2PACX-1vSImNvWFPls4C61UdOoxkjE860RgTPxq4EfvBhcDRmorwM8ZjTWNwewwk-1Se9gmmJGDpXZ5t-pbuJq/pub?embedded=true",
                    4: "https://docs.google.com/document/d/e/2PACX-1vR9cnbP8kBMcyAvJuu1Immtb9i5vmWjNfkqu3OhikQQUMAaX5MFJuAL17E4AFNCT6wr1puQZw8d0nfd/pub?embedded=true"
                },
                "india": {
                    1: "https://docs.google.com/document/d/e/2PACX-1vQVd3NFOy8P_3N6qPRap5F9PwPJm_Ya1ZGl1yeGyVWZjBjau-sXnq2MsqRvBfb-FvgDQadeAyYkIHWv/pub?embedded=true",
                    2: "https://docs.google.com/document/d/e/2PACX-1vREYDM6YQ-A3nnKNyFQNT1tKBXy18Yxj1ohKOtOMVyCUOsKaMyHyP8WEifduSZaho9oWh8mADR-pQXP/pub?embedded=true",
                    3: "https://docs.google.com/document/d/e/2PACX-1vR2LS3cqiqK0IH29nC2333HM0Uo6MMBS-X20f0dQx_yurkoVK16SdIi8ix0H-ME5g-uEk7PHpVPlqI-/pub?embedded=true",
                    4: "https://docs.google.com/document/d/e/2PACX-1vQLuD7ZRk2M-Ph90cDBcG76583do5Tt4FETjewYd29gGJcWmhKKkDODwrnDl7mP3azltmZ7nL2zcxkC/pub?embedded=true"
                },
                "tango": {
                    1: "https://docs.google.com/document/d/e/2PACX-1vRyjOKWi47QF_RW5hV5GbYKMR5jR5FiRZblpKYg0EeaK8PTclvJmttGYj9AynIp2OZQV4yZZ1Ob6hNB/pub?embedded=true",
                    2: "https://docs.google.com/document/d/e/2PACX-1vQ8ZhCN6Wf6yO5-uEHtVpVWTPMg0kCDEs6c7QiCzWHtK0YWxnhP50zq_Rt9jDzD7y6Re_evsRHcuNm4/pub?embedded=true",
                    3: "https://docs.google.com/document/d/e/2PACX-1vTt88ssmt65Bgoa3HxTntMBB58nQ8G9Mm2FFXz153lwtRwLp0pTNWlgfVr8Z8WhJ0QIngbHraH9Cgaf/pub?embedded=true",
                    4: "https://docs.google.com/document/d/e/2PACX-1vRP8jTyKyNB88gyV5Cu4aDAmsQQ-2bFPqePHvCw0q2ErYPM73Zr9nG4XRHuebl1UTDY56-DN0EqQsEn/pub?embedded=true"
                }
            };

            // Parse US Military Date format (e.g. 25 SEP 26 or 25-SEP-26)
            function parseMilitaryDate(str) {
                if (!str) return null;
                const decoded = decodeURIComponent(str).trim();
                const match = decoded.match(/^(\d{1,2})[\s\-]?([a-zA-Z]{3})[\s\-]?(\d{2}|\d{4})$/);
                if (!match) return null;

                const day = parseInt(match[1], 10);
                const monthStr = match[2].toUpperCase();
                let year = parseInt(match[3], 10);
                if (year < 100) year += 2000;

                const months = {
                    "JAN": 0, "FEB": 1, "MAR": 2, "APR": 3, "MAY": 4, "JUN": 5,
                    "JUL": 6, "AUG": 7, "SEP": 8, "OCT": 9, "NOV": 10, "DEC": 11
                };

                if (!(monthStr in months)) return null;
                const monthIndex = months[monthStr];

                const dateObj = new Date(year, monthIndex, day);
                if (isNaN(dateObj.getTime())) return null;

                const dayOfWeek = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
                const formattedDate = `${String(day).padStart(2, '0')} ${monthStr} ${String(year).slice(-2)}`;

                return {
                    dayOfWeek: dayOfWeek,
                    dateStr: formattedDate,
                    dateObj: dateObj
                };
            }

            function getTodayMilitaryStr() {
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                const month = months[today.getMonth()];
                const year = String(today.getFullYear()).slice(-2);
                return `${day} ${month} ${year}`;
            }

            // 4-Mondays calculation algorithm: computes which week (1, 2, 3, or 4) a date belongs to
            function get4MondaysCycleWeek(targetDate) {
                // Fixed Anchor Monday: Jan 1, 2024
                const anchorMonday = new Date(2024, 0, 1);
                anchorMonday.setHours(0, 0, 0, 0);

                // Determine Monday for targetDate's week
                const d = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
                const day = d.getDay(); // 0 is Sun, 1 is Mon...
                const diffToMon = d.getDate() - day + (day === 0 ? -6 : 1);
                const targetMonday = new Date(d.setDate(diffToMon));
                targetMonday.setHours(0, 0, 0, 0);

                // Calculate difference in whole weeks from anchor Monday
                const diffTime = targetMonday.getTime() - anchorMonday.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const diffWeeks = Math.floor(diffDays / 7);

                // Compute 1-based rolling 4-week cycle index (1, 2, 3, or 4)
                let weekNum = ((diffWeeks % 4) + 4) % 4 + 1;
                return weekNum;
            }

            // Parse URL query parameters
            const params = new URLSearchParams(window.location.search);

            // A. Determine Track parameter ('orientation', 'india', or 'tango')
            let selectedTrack = "orientation"; // Fallback default
            if (params.has("track") && trackDocConfig[params.get("track").toLowerCase()]) {
                selectedTrack = params.get("track").toLowerCase();
            } else {
                for (const tKey of Object.keys(trackDocConfig)) {
                    if (params.has(tKey)) {
                        selectedTrack = tKey;
                        break;
                    }
                }
            }

            // B. Parse Date String & Compute 4-Mondays Cycle Week
            const datestrParam = params.get("datestr");
            const dateData = parseMilitaryDate(datestrParam) || parseMilitaryDate(getTodayMilitaryStr());

            if (dateData) {
                dayOfWeekEl.textContent = dateData.dayOfWeek;
                formattedDateEl.textContent = dateData.dateStr;
            }

            let computedWeek = dateData ? get4MondaysCycleWeek(dateData.dateObj) : 1;

            // Optional explicit override for testing (?week=1..4)
            if (params.has("week")) {
                const overrideW = parseInt(params.get("week"), 10);
                if (overrideW >= 1 && overrideW <= 4) {
                    computedWeek = overrideW;
                }
            }

            // C. Determine Background / Right-side schedule ID ('red1'-'red5', 'blue1'-'blue5')
            let pageId = "red2"; // Fallback default
            if (params.has("id") && docConfig[params.get("id")]) {
                pageId = params.get("id");
            } else {
                for (const key of Object.keys(docConfig)) {
                    if (params.has(key)) {
                        pageId = key;
                        break;
                    }
                }
            }

            // D. Assign dynamic sources to DOM elements
            bgImg.src = `https://johnk-cap.github.io/web-aids/${pageId}.jpg`;
            trackFrame.src = trackDocConfig[selectedTrack][computedWeek];
            leftFrame.src = docConfig[pageId].left;
            rightFrame.src = docConfig[pageId].right;

            let naturalWidth = 0;
            let naturalHeight = 0;

            // Detect mobile devices via userAgent or touch points / screen size criteria
            function isMobileDevice() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
                const isTouchMobile = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && (window.innerWidth <= 1024 || window.innerHeight <= 1024);
                return mobileRegex.test(userAgent) || isTouchMobile;
            }

            const isMobile = isMobileDevice();

            if (isMobile) {
                viewportWrapper.classList.add('is-mobile-rotated');
            }

            function updateLayout() {
                if (!naturalWidth || !naturalHeight) return;

                // When rotated 90deg on mobile, effective width and height swap places
                let vw = window.innerWidth;
                let vh = window.innerHeight;

                if (isMobile) {
                    vw = window.innerHeight;
                    vh = window.innerWidth;
                }

                const imgAspect = naturalWidth / naturalHeight;
                const screenAspect = vw / vh;

                let renderedW, renderedH;

                if (screenAspect > imgAspect) {
                    // Viewport is wider than image aspect ratio -> constrained by height
                    renderedH = vh;
                    renderedW = vh * imgAspect;
                } else {
                    // Viewport is taller than image aspect ratio -> constrained by width
                    renderedW = vw;
                    renderedH = vw / imgAspect;
                }

                // Apply calculated dimensions to the aspect container
                imgContainer.style.width = Math.floor(renderedW) + 'px';
                imgContainer.style.height = Math.floor(renderedH) + 'px';
            }

            function onImageLoad() {
                naturalWidth = bgImg.naturalWidth || 1920;
                naturalHeight = bgImg.naturalHeight || 1080;
                updateLayout();
                
                // Trigger smooth 1.5s fade-in transition
                viewportWrapper.classList.add('loaded');
            }

            if (bgImg.complete && bgImg.naturalWidth) {
                onImageLoad();
            } else {
                bgImg.addEventListener('load', onImageLoad);
            }

            window.addEventListener('resize', updateLayout);
            window.addEventListener('orientationchange', updateLayout);
        })();
    </script>

</body>
</html>
