<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- No-cache Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Curriculum Display</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Root viewport container for optional mobile rotation and fade-in */
        #viewport-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            
            /* Initial state for fade-in */
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        /* Class added via JS once layout and image are ready */
        #viewport-wrapper.loaded {
            opacity: 1;
        }

        /* 90-degree clockwise rotation styling for mobile devices */
        .is-mobile-rotated {
            width: 100vh !important;
            height: 100vw !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
        }

        /* Aspect ratio container scaled dynamically to background image */
        #image-container {
            position: relative;
            overflow: hidden;
            background-color: transparent;
        }

        /* =========================================================
           NAVIGATION HOTSPOT: Right Half of Top-Right Quadrant
           (top: 0%, left: 75%, width: 25%, height: 50%)
           ========================================================= */
        .nav-hotspot-right {
            position: absolute;
            top: 0;
            left: 75%;
            width: 25%;
            height: 50%;
            z-index: 30;
            cursor: pointer;
            background-color: transparent;
            display: block;
        }

        /* =========================================================
           LEFT HALF: Target Document Frame & Interactive Widgets
           ========================================================= */
        .left-half-doc-wrapper {
            position: absolute;
            top: 7.5%;
            left: 5.0%;      /* Reverted to original 5.0% */
            width: 42.5%;     /* Reverted to original 42.5% */
            height: 85.0%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            background-color: #ffffff;
        }

        .left-frame-widgets {
            height: 42px;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            gap: 8px;
            border-bottom: 1px solid #333;
            font-size: 13px;
            user-select: none;
            flex-shrink: 0;
        }

        .widget-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .widget-btn, .widget-select {
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .widget-btn:hover, .widget-select:hover {
            background-color: #3d3d3d;
            border-color: #666;
        }

        .left-frame-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
            container-type: size;
            overflow-y: auto; /* Allows smooth scrolling */
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .left-frame-container iframe {
            width: 100%;
            min-height: 100%;
            height: 1800px;
            border: 0;
            background-color: #ffffff;
            display: block;
        }

        /* =========================================================
           RIGHT HALF: Date Display & Fixed Dual Schedule Frames
           ========================================================= */
        .date-display-wrapper {
            position: absolute;
            top: 0;
            left: 50%;
            width: 25%;
            height: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
            container-type: size;
            z-index: 10;
        }

        .day-text {
            color: #000000;
            font-weight: 800;
            font-size: 14cqw;
            line-height: 1.15;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
            letter-spacing: 0.02em;
        }

        .date-text {
            color: #000000;
            font-weight: 700;
            font-size: 11cqw;
            line-height: 1.15;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
            letter-spacing: 0.05em;
        }

        .doc-frame-wrapper {
            position: absolute;
            bottom: 7.5%;
            right: 5.0%;
            width: 42.5%;
            height: 45.5%;
            overflow: hidden;
            pointer-events: none;
            display: flex;
            flex-direction: row;
            gap: 2%;
        }

        .sub-frame-container {
            width: 49%;
            height: 100%;
            position: relative;
            container-type: size;
            overflow: hidden;
        }

        .sub-frame-container iframe {
            width: 800px;
            height: 1800px;
            border: 0;
            background-color: transparent;
            overflow: hidden;
            pointer-events: none;
            -ms-overflow-style: none;
            scrollbar-width: none;
            transform-origin: top left;
            transform: scale(calc(100cqw / 800));
        }

        .sub-frame-container iframe::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

                </div>

                    <iframe 
                        id="right-frame"
                        scrolling="no"
                        title="Embedded Google Document 2">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

            // Parse US Military Date format (e.g. 25 SEP 26 or 25-SEP-26)
            function parseMilitaryDate(str) {
                if (!str) return null;
                const decoded = decodeURIComponent(str).trim();
                const match = decoded.match(/^(\d{1,2})[\s\-]?([a-zA-Z]{3})[\s\-]?(\d{2}|\d{4})$/);
                if (!match) return null;

                const day = parseInt(match[1], 10);
                const monthStr = match[2].toUpperCase();
                let year = parseInt(match[3], 10);
                if (year < 100) year += 2000;

                const months = {
                    "JAN": 0, "FEB": 1, "MAR": 2, "APR": 3, "MAY": 4, "JUN": 5,
                    "JUL": 6, "AUG": 7, "SEP": 8, "OCT": 9, "NOV": 10, "DEC": 11
                };

                if (!(monthStr in months)) return null;
                const monthIndex = months[monthStr];

                const dateObj = new Date(year, monthIndex, day);
                if (isNaN(dateObj.getTime())) return null;

                const dayOfWeek = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
                const formattedDate = `${String(day).padStart(2, '0')} ${monthStr} ${String(year).slice(-2)}`;

                return {
                    dayOfWeek: dayOfWeek,
                    dateStr: formattedDate
                };
            }

            function getTodayMilitaryStr() {
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                const month = months[today.getMonth()];
                const year = String(today.getFullYear()).slice(-2);
                return `${day} ${month} ${year}`;
            }

            // Parse Query Parameters
            const params = new URLSearchParams(window.location.search);

            // 1. Determine Page ID / Week (red1..blue5)
            let pageId = "red2"; // Fallback default
            if (params.has("id") && docConfig[params.get("id")]) {
                pageId = params.get("id");
            } else if (params.has("week") && docConfig[params.get("week")]) {
                pageId = params.get("week");
            } else {
                for (const key of Object.keys(docConfig)) {
                    if (params.has(key)) {
                        pageId = key;
                        break;
                    }
                }
            }

            // 2. Determine FLT Track (orientation, india, tango)
            let currentTrack = "orientation";
            if (params.has("flt") && trackDocConfig[params.get("flt").toLowerCase()]) {
                currentTrack = params.get("flt").toLowerCase();
            } else if (params.has("track") && trackDocConfig[params.get("track").toLowerCase()]) {
                currentTrack = params.get("track").toLowerCase();
            } else if (params.has("orientation")) {
                currentTrack = "orientation";
            } else if (params.has("india")) {
                currentTrack = "india";
            } else if (params.has("tango")) {
                currentTrack = "tango";
            }

            // Synchronize Select Controls
            trackSelect.value = currentTrack;
            idSelect.value = pageId;

            // Update Left Target Frame Source
            function updateMainTargetDoc() {
                const track = trackSelect.value;
                const id = idSelect.value;
                let targetUrl = "https://docs.google.com/document/d/e/2PACX-1vQPgfp_QHRXqqKf3OeJtzqfTi2p7IqhhaOkZL1mzCybjlHbLimE0FfQpw0OhQAVUzEdcBF5yyAY8QGp/pub?embedded=true";

                if (trackDocConfig[track] && trackDocConfig[track][id]) {
                    targetUrl = trackDocConfig[track][id];
                }

                mainTargetFrame.src = targetUrl;
            }

            trackSelect.addEventListener('change', updateMainTargetDoc);
            idSelect.addEventListener('change', updateMainTargetDoc);

            // Widget Scroll Controls
            btnScrollUp.addEventListener('click', () => {
                leftScrollContainer.scrollBy({ top: -250, behavior: 'smooth' });
            });
            btnScrollDown.addEventListener('click', () => {
                leftScrollContainer.scrollBy({ top: 250, behavior: 'smooth' });
            });

            // Parse Date String Parameter
            const datestrParam = params.get("datestr");
            const dateData = parseMilitaryDate(datestrParam) || parseMilitaryDate(getTodayMilitaryStr());

            if (dateData) {
                dayOfWeekEl.textContent = dateData.dayOfWeek;
                formattedDateEl.textContent = dateData.dateStr;
            }

            // Apply dynamic sources
            bgImg.src = `https://johnk-cap.github.io/web-aids/${pageId}.jpg`;
            leftFrame.src = docConfig[pageId].left;
            rightFrame.src = docConfig[pageId].right;
            updateMainTargetDoc();

            let naturalWidth = 0;
            let naturalHeight = 0;

            function isMobileDevice() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
                const isTouchMobile = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && (window.innerWidth <= 1024 || window.innerHeight <= 1024);
                return mobileRegex.test(userAgent) || isTouchMobile;
            }

            const isMobile = isMobileDevice();

            if (isMobile) {
                viewportWrapper.classList.add('is-mobile-rotated');
            }

            function updateLayout() {
                if (!naturalWidth || !naturalHeight) return;

                let vw = window.innerWidth;
                let vh = window.innerHeight;

                if (isMobile) {
                    vw = window.innerHeight;
                    vh = window.innerWidth;
                }

                const imgAspect = naturalWidth / naturalHeight;
                const screenAspect = vw / vh;

                let renderedW, renderedH;

                if (screenAspect > imgAspect) {
                    renderedH = vh;
                    renderedW = vh * imgAspect;
                } else {
                    renderedW = vw;
                    renderedH = vw / imgAspect;
                }

                imgContainer.style.width = Math.floor(renderedW) + 'px';
                imgContainer.style.height = Math.floor(renderedH) + 'px';
            }

            function onImageLoad() {
                naturalWidth = bgImg.naturalWidth || 1920;
                naturalHeight = bgImg.naturalHeight || 1080;
                updateLayout();
                
                viewportWrapper.classList.add('loaded');
            }

            if (bgImg.complete && bgImg.naturalWidth) {
                onImageLoad();
            } else {
                bgImg.addEventListener('load', onImageLoad);
            }

            window.addEventListener('resize', updateLayout);
            window.addEventListener('orientationchange', updateLayout);
        })();
    </script>
</body>
</html>
