<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- No-cache Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Embedded Document Viewer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">

    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/60 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shadow-md sticky top-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-bold tracking-tight text-white">Document Viewer</h1>
                <p class="text-xs text-slate-400">Live Embedded View</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="document.getElementById('docFrame').src = document.getElementById('docFrame').src;" class="px-3 py-1.5 text-xs font-medium bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 rounded-md transition duration-150 flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Refresh Frame</span>
            </button>
            <a href="https://docs.google.com/document/d/e/2PACX-1vSYuF-hfjcDpQzWkFOMOb1VqUjWHPVLO8lmknbfISgoTcUX12uVmBsMt0p_HKLH4u5rR0RvM-aL0pGo/pub?embedded=true" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white rounded-md transition duration-150 flex items-center space-x-1.5">
                <span>Open Full Page</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
            </a>
        </div>
    </header>

    <main class="flex-1 p-2 md:p-4 flex flex-col h-[calc(100vh-65px)]">
        <div class="w-full h-full bg-white rounded-xl shadow-xl overflow-hidden border border-slate-700/50 flex flex-col relative">
            <iframe 
                id="docFrame"
                src="https://docs.google.com/document/d/e/2PACX-1vSYuF-hfjcDpQzWkFOMOb1VqUjWHPVLO8lmknbfISgoTcUX12uVmBsMt0p_HKLH4u5rR0RvM-aL0pGo/pub?embedded=true"
                class="w-full h-full border-0 flex-1"
                title="Embedded Google Document"
                loading="lazy">
            </iframe>
        </div>
    </main>

</body>
</html>
