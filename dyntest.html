<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- No-cache Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Schedule Display</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* Root viewport container for optional mobile rotation */
        #viewport-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 90-degree clockwise rotation styling for mobile devices */
        .is-mobile-rotated {
            width: 100vh !important;
            height: 100vw !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
        }

        /* Container that dynamically scales to match image dimensions */
        #image-container {
            position: relative;
            overflow: hidden;
            background-color: transparent;
        }

        /* Frame sized 15% smaller than 50% quadrant (42.5% x 45.5%) 
           Positioned at bottom: 7.5%, right: 5.0% */
        .doc-frame-wrapper {
            position: absolute;
            bottom: 7.5%;
            right: 5.0%;
            width: 42.5%;
            height: 45.5%;
            overflow: hidden;
            pointer-events: none; /* Completely blocks mouse wheel, touch drag, and click events */
            
            /* Container query setup to drive iframe zoom scaling */
            container-type: size;
        }

        /* 
           By giving the iframe a fixed internal base dimension (800px x 800px) 
           and scaling it via dynamic transform relative to container width (cqw), 
           the document text scales like an image—preserving a fixed line layout.
        */
        .doc-frame-wrapper iframe {
            width: 800px;
            height: 800px;
            border: 0;
            background-color: transparent;
            overflow: hidden;
            pointer-events: none;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
            transform-origin: top left;
            transform: scale(calc(100cqw / 800));
        }

        .doc-frame-wrapper iframe::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center overflow-hidden bg-black select-none">

    <!-- Root Viewport Wrapper -->
    <div id="viewport-wrapper">
        <!-- Image Wrapper Container -->
        <div id="image-container" class="relative">
            <!-- Background Image -->
            <img 
                id="bg-image" 
                src="https://johnk-cap.github.io/web-aids/red2.jpg" 
                alt="Background" 
                class="w-full h-full block object-fill pointer-events-none"
            />

            <!-- Non-Scrolling Document Iframe in Lower Right Quadrant -->
            <div class="doc-frame-wrapper bg-transparent overflow-hidden pointer-events-none">
                <iframe 
                    src="https://docs.google.com/document/d/e/2PACX-1vSYuF-hfjcDpQzWkFOMOb1VqUjWHPVLO8lmknbfISgoTcUX12uVmBsMt0p_HKLH4u5rR0RvM-aL0pGo/pub"
                    scrolling="no"
                    title="Embedded Google Document">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const bgImg = document.getElementById('bg-image');
            const imgContainer = document.getElementById('image-container');
            const viewportWrapper = document.getElementById('viewport-wrapper');
            
            let naturalWidth = 0;
            let naturalHeight = 0;

            // Detect mobile devices via userAgent or touch points / screen size criteria
            function isMobileDevice() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
                const isTouchMobile = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && (window.innerWidth <= 1024 || window.innerHeight <= 1024);
                return mobileRegex.test(userAgent) || isTouchMobile;
            }

            const isMobile = isMobileDevice();

            if (isMobile) {
                viewportWrapper.classList.add('is-mobile-rotated');
            }

            function updateLayout() {
                if (!naturalWidth || !naturalHeight) return;

                // When rotated 90deg on mobile, the effective width and height are swapped
                let vw = window.innerWidth;
                let vh = window.innerHeight;

                if (isMobile) {
                    vw = window.innerHeight;
                    vh = window.innerWidth;
                }

                const imgAspect = naturalWidth / naturalHeight;
                const screenAspect = vw / vh;

                let renderedW, renderedH;

                if (screenAspect > imgAspect) {
                    // Viewport is wider than image aspect ratio -> constrained by height
                    renderedH = vh;
                    renderedW = vh * imgAspect;
                } else {
                    // Viewport is taller than image aspect ratio -> constrained by width
                    renderedW = vw;
                    renderedH = vw / imgAspect;
                }

                // Apply calculated dimensions to the container
                imgContainer.style.width = Math.floor(renderedW) + 'px';
                imgContainer.style.height = Math.floor(renderedH) + 'px';
            }

            function onImageLoad() {
                naturalWidth = bgImg.naturalWidth || 1920;
                naturalHeight = bgImg.naturalHeight || 1080;
                updateLayout();
            }

            if (bgImg.complete && bgImg.naturalWidth) {
                onImageLoad();
            } else {
                bgImg.addEventListener('load', onImageLoad);
            }

            window.addEventListener('resize', updateLayout);
            window.addEventListener('orientationchange', updateLayout);
        })();
    </script>

</body>
</html>
