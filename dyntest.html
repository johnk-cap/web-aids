<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- No-cache Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Embedded Document Viewer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 relative font-sans text-slate-900">

    <!-- Simple headline in top-left area -->
    <div class="absolute top-6 left-6">
        <h1 class="text-xl font-bold tracking-tight text-slate-800">Document Viewer</h1>
    </div>

    <!-- Bottom-Right Quadrant (50% width x 50% height of viewable window) -->
    <div class="absolute bottom-0 right-0 w-[50vw] h-[50vh] bg-white border-t border-l border-slate-200">
        <iframe 
            src="https://docs.google.com/document/d/e/2PACX-1vSYuF-hfjcDpQzWkFOMOb1VqUjWHPVLO8lmknbfISgoTcUX12uVmBsMt0p_HKLH4u5rR0RvM-aL0pGo/pub?embedded=true"
            class="w-full h-full border-0"
            title="Embedded Google Document">
        </iframe>
    </div>

</body>
</html>
